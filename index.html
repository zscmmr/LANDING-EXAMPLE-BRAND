<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Temukan tautan resmi ZSCMMR." />
    <meta name="theme-color" content="#1a1a1a" />
    <title>ZSCMMR | Official Links</title>
    <style>
      :root {
        --bg-dark: #1a1a1a;
        --bg-panel: rgba(28, 28, 28, 0.96);
        --border: rgba(200, 200, 200, 0.18);
        --text: #f4f4f4;
        --muted: #d1d1d1;
        --hover: rgba(146, 172, 110, 0.18);
        --lime: #a7c777;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #1c1c1c 0%, #141414 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .container {
        width: min(90vw, 720px);
        padding: 28px 18px 36px;
      }

      @media (max-width: 480px) {
        .container {
          width: 100%;
          max-width: 320px;
          padding: 12px 2px 18px;
        }

        .logo-wrap {
          margin-bottom: 12px;
        }

        .logo-wrap img {
          width: min(48vw, 150px);
        }

        .card {
          width: calc(100% - 4px);
          max-width: 300px;
          padding: 3px;
          border-radius: 8px;
        }

        .links {
          gap: 3px;
        }

        a {
          padding: 12px 8px;
          font-size: 14px;
          letter-spacing: 0.03em;
        }

        .footer {
          font-size: 10px;
          letter-spacing: 0.12em;
          margin-top: 12px;
          line-height: 1.4;
        }
      }

      .logo-wrap {
        text-align: center;
        margin-bottom: 22px;
      }

      .logo-wrap img {
        width: 180px;
        height: auto;
        display: inline-block;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
      }

      .card {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: none;
        overflow: hidden;
        padding: 5px;
        width: min(90%, 540px);
        margin: 0 auto;
      }

      .links {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a {
        display: block;
        text-align: center;
        padding: 15px 14px;
        text-decoration: none;
        color: var(--text);
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.01);
        border: 1px solid transparent;
        border-radius: 10px;
        transition: background 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
      }

      a:hover {
        background: var(--hover);
        border-color: rgba(167, 199, 119, 0.35);
        transform: translateY(-2px);
      }

      a:focus-visible {
        outline: 2px solid var(--lime);
        outline-offset: 2px;
      }

      .footer {
        margin-top: 18px;
        text-align: center;
        color: rgba(255, 255, 255, 0.75);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 600;
      }

      .footer span {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-wrap">
        <img src="logo2.png" alt="Logo ZSCMMR" />
      </div>

      <nav class="card" aria-label="Tautan resmi ZSCMMR">
        <ul class="links">
          <li><a href="https://zscmmr.github.io/EXAMPLE-BRAND/" target="_blank" rel="noopener noreferrer">Website</a></li>
          <li><a href="https://web.whatsapp.com/" target="_blank" rel="noopener noreferrer">WhatsApp</a></li>
          <li><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
          <li><a href="https://x.com/?lang=id" target="_blank" rel="noopener noreferrer">Twitter</a></li>
          <li><a href="https://www.facebook.com/?locale=id_ID" target="_blank" rel="noopener noreferrer">Facebook</a></li>
          <li><a href="https://shopee.co.id/" target="_blank" rel="noopener noreferrer">Shopee</a></li>
          <li><a href="https://www.tokopedia.com/" target="_blank" rel="noopener noreferrer">Tokopedia</a></li>
          <li><a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube</a></li>
          <li><a href="https://www.tiktok.com/id-ID/" target="_blank" rel="noopener noreferrer">TikTok</a></li>
        </ul>
      </nav>

      <div class="footer">
        <span>©</span> ZSCMMR
      </div>
    </div>
  </body>
</html>
